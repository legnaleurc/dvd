name: engine

on:
  push:
    paths:
      - '.github/workflows/engine.yaml'
      - 'engine/**'
  pull_request:
    paths:
      - '.github/workflows/engine.yaml'
      - 'engine/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: "engine"
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: engine
        run: make setup
      - name: Lint
        working-directory: engine
        run: make lint
      - name: Test
        working-directory: engine
        run: make test
